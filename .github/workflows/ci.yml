name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The unit and repository suites run on the embedded adapter, which is
      # exactly the zero-config path a contributor gets.
      - name: Unit and integration tests
        run: npm run test

      - name: Production build
        run: npm run build

  journey:
    name: primary journey over real HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality

    # A real Postgres, so this job exercises the hosted-store code path rather
    # than the embedded fallback. Without it the production storage guard
    # correctly refuses to pass and the journey cannot run.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mintline
          POSTGRES_PASSWORD: mintline
          POSTGRES_DB: mintline
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mintline:mintline@localhost:5432/mintline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Build
        run: npm run build

      - name: Walk create → read → decide → assay → agent → replay → export → delete
        # Boots its own production server and exercises the whole product loop
        # over HTTP, including the MCP endpoint and chain replay.
        run: node scripts/smoke.mjs