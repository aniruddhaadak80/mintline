name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The unit and repository suites run on the embedded adapter, which is
      # exactly the zero-config path a contributor gets.
      - name: Unit and integration tests
        run: npm run test

      - name: Production build
        run: npm run build

  journey:
    name: primary journey over real HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Build
        run: npm run build

      - name: Walk create → read → decide → assay → agent → replay → export → delete
        # Boots its own production server and exercises the whole product loop
        # over HTTP: create, read back, decide, run the engine, mutate through
        # the MCP endpoint, replay the chain, export the dossier, delete, and
        # confirm the tombstone still replays.
        #
        # No DATABASE_URL here on purpose. This proves a production build is
        # fully functional with zero configuration, on the embedded adapter. The
        # hosted path is verified separately by scripts/verify-live.mjs against
        # the real deployment.
        run: node scripts/smoke.mjs